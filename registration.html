<section class="page-title">
    <div class="container">
        <h1>Registration</h1>
    </div>
</section>
 
<div class="container content">
    <main>
        <section id="registration">
            <h3>Daftar Jadi Fans Sharks</h3>
            <form action="#" method="post" class="simple-form">
                <label for="nama">Nama lengkap*</label>
                <input type="text" id="nama" name="nama" required>
 
                <label for="email">E-mail*</label>
                <input type="email" id="email" name="email" required>
 
                <label for="telepon">Nomor telepon*</label>
                <input type="tel" id="telepon" name="telepon" required>
 
                <label for="kota">Kota asal</label>
                <input type="text" id="kota" name="kota">
 
                <label for="favorit">Pemain favorit</label>
                <select id="favorit" name="favorit">
                    <option value=""></option>
                    <option>Macklin Celebrini</option>
                    <option>Will Smith</option>
                    <option>Nolan Allan</option>
                    <option>Dmitry Orlov</option>
                    <option>Darnell Nurse</option>
                    <option>Yaroslav Askarov</option>
                    <option>Lainnya</option>
                </select>
 
                <label for="alasan">Alasan bergabung</label>
                <textarea id="alasan" name="alasan" rows="4"></textarea>
 
                <p class="check">
                    <input type="checkbox" id="setuju" name="setuju" required>
                    <label for="setuju">Saya setuju menerima informasi dari komunitas*</label>
                </p>
 
                <button type="submit" class="send">Daftar</button>
            </form>
        </section>
    </main>
